<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Post Data with Bearer Token</title>
</head>
<body>
  <form id="postForm">
    <label>
      Name:
      <input type="text" name="name" value="mi ayam" required>
    </label><br>

    <label>
      Smallest Unit ID:
      <input type="text" name="smallest_unit_id" value="8ae3cc1b-7325-4ead-9c00-d260a3319a29" required>
    </label><br>

    <label>
      Category ID:
      <input type="text" name="category_id" value="5c887f61-29d3-4f3d-a0d2-411d7e1c3087" required>
    </label><br>

    <label>
      SKU:
      <input type="text" name="sku" value="test" required>
    </label><br>

    <label>
      Description:
      <textarea name="description" required>test</textarea>
    </label><br>

    <label>
      Status:
      <input type="checkbox" name="status">
    </label><br>

    <label>
      Has Receipt:
      <input type="checkbox" name="has_receipt">
    </label><br>

    <label>
      Price:
      <input type="number" name="price" value="5000" required>
    </label><br>

    <fieldset>
      <legend>Materials</legend>
      <div>
        <label>
          Material 1 ID:
          <input type="text" name="materials[0][material_id]" value="6aaab138-526c-41ae-a982-fa39efb5538e" required>
        </label><br>
        <label>
          Material 1 Quantity:
          <input type="number" name="materials[0][quantity]" value="10" required>
        </label>
      </div>
      <div>
        <label>
          Material 2 ID:
          <input type="text" name="materials[1][material_id]" value="another-id" required>
        </label><br>
        <label>
          Material 2 Quantity:
          <input type="number" name="materials[1][quantity]" value="15" required>
        </label>
      </div>
    </fieldset>

    <label>
      Image:
      <input type="file" name="image" accept="image/*" required>
    </label><br><br>

    <button type="submit">Submit</button>
  </form>

  <script>
    document.getElementById("postForm").addEventListener("submit", async function (event) {
  event.preventDefault();

  const form = event.target;
  const formData = new FormData(form);

  // Convert checkbox values to true/false
  formData.set("status", form.status.checked);
  formData.set("has_receipt", form.has_receipt.checked);

  // Debug: Log all the data in FormData
  for (const [key, value] of formData.entries()) {
    console.log(key, value);
  }

  const token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJjb21wYW55X2NvZGUiOiJBUkkiLCJjb21wYW55X2lkIjoiMDE5M2VlNmUtYzBhNi03Njg3LTlkZTQtNmM1NWFlYWMzNzIwIiwiZXhwIjoxNzM1NDc2ODU3LCJpZCI6IjAxOTNlZTZlLWMwYjYtNzE4ZS05ZDdmLTU3Yjk1NTg2ZjE5NSIsImlzX2VtcGxveWVlIjpmYWxzZSwibmFtZSI6IkFyaSBZb2dhIE5hbmRhIn0.ODWztEapj4wQPG0W1KNNFE7AdmUofrN5jPGNSnDCy3U";
  
  try {
    const response = await fetch("http://127.0.0.1:6741/api/v1/sellable/with-assign-material", {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${token}`
      },
      body: formData,
    });

    if (response.ok) {
      const result = await response.json();
      alert("Success: " + JSON.stringify(result));
    } else {
      const error = await response.text();
      alert("Error: " + error);
    }
  } catch (error) {
    console.error("Error submitting form:", error);
    alert("Failed to submit the form. Please try again.");
  }
});

  </script>
</body>
</html>
